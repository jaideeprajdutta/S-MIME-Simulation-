<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>{{ title }}</h1>
    <div class="result-box">
        <pre>{{ result }}</pre>
    </div>

    {% if content %}
    <h2>Decrypted Email Content:</h2>
    <div class="email-box">
        <pre>{{ content }}</pre>
    </div>
    {% endif %}

    <a href="{{ url_for('index') }}" class="back-btn">⬅ Back to Home</a>
</body>
</html>
